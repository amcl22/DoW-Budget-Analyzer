# Deploys the app to Cloudflare (deploy/cloudflare) on every push to main, or on demand from
# the Actions tab ("Run workflow"). Repository secrets it uses:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   how GitHub signs in to Cloudflare
#   DATABASE_URL, ACCESS_TOKEN                     copied to the app as Cloudflare secrets
#   ANTHROPIC_API_KEY                              optional; turns on /ask
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secrets are set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL ACCESS_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: First deploy (creates the Worker so its secrets can be set)
        run: npx wrangler deployments list >/dev/null 2>&1 || npx wrangler deploy
      - name: Upload the app's secrets to Cloudflare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node -e 'const ks=["DATABASE_URL","ACCESS_TOKEN","ANTHROPIC_API_KEY"];
            console.log(JSON.stringify(Object.fromEntries(ks.filter(k=>process.env[k]).map(k=>[k,process.env[k]]))))' \
            > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"
      - name: Deploy (builds the Docker image and rolls it out)
        run: npx wrangler deploy
      - name: Show the address
        run: |
          echo "Deployed. Open the Worker in the Cloudflare dashboard (Workers & Pages > dow-budget-search)"
          echo "for its address, then send the team: https://<that address>/?k=<your ACCESS_TOKEN>"
