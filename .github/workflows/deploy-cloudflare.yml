# Deploys to Cloudflare (deploy/cloudflare) on every push to main, or on demand from the
# Actions tab. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token made from the
# "Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID. The app's own secrets
# (DATABASE_URL, ACCESS_TOKEN, ANTHROPIC_API_KEY) live in Cloudflare, not here.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: deploy/cloudflare
        run: npm ci --no-audit --no-fund
      - name: Deploy (builds the Docker image and pushes it to Cloudflare)
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
