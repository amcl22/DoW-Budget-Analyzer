services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://budget:budget@db:5432/budget
      # the team-link secret: `budget new-access-token`, then put it in .env as ACCESS_TOKEN=...
      ACCESS_TOKEN: ${ACCESS_TOKEN:?set ACCESS_TOKEN in .env}
      # optional: turns on /ask (Q&A); without it the rest of the app works as before
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - rawdata:/app/data   # downloaded budget files, reused across ingestion runs

volumes:
  pgdata:
  rawdata:
